<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TranscriptVault — YouTube transcripts, instantly</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* ---- color ---- */
    --bg: #08090c;
    --surface: rgba(255,255,255,0.024);
    --surface-2: rgba(255,255,255,0.045);
    --surface-3: rgba(255,255,255,0.075);
    --border: rgba(255,255,255,0.08);
    --border-2: rgba(255,255,255,0.13);
    --text: #f0f1f3;
    --text-2: #a7abb4;
    --muted: #898e99;          /* ~5:1 on --bg (AA) */
    --accent: #6e7bf2;
    --accent-2: #9a8bf7;
    --accent-soft: rgba(110,123,242,0.14);
    --accent-line: rgba(110,123,242,0.32);
    --ring: rgba(110,123,242,0.55);
    --green: #4ccf89;
    --green-soft: rgba(76,207,137,0.14);
    --red: #f2797b;
    --red-soft: rgba(242,121,123,0.13);
    --amber: #e8b866;

    /* ---- radius (child < parent) ---- */
    --r-xs: 6px;   /* kbd */
    --r-sm: 8px;   /* pills, inner controls */
    --r-md: 10px;  /* buttons, inputs, toggle */
    --r-lg: 12px;  /* panels inside cards */
    --r-xl: 16px;  /* cards */
    --r-2xl: 20px; /* command bar */

    /* ---- shadow ---- */
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 10px 30px -14px rgba(0,0,0,0.6);
    --shadow-lg: 0 26px 64px -28px rgba(0,0,0,0.72);
    --inset-hi: inset 0 1px 0 rgba(255,255,255,0.05);

    /* ---- motion ---- */
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --t-fast: 120ms;
    --t: 180ms;
    --t-slow: 280ms;

    --sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    letter-spacing: -0.01em;
    overflow-x: hidden;
  }

  /* soft ambient gradient — the only "glow", kept low and diffuse */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(1000px 460px at 50% -12%, rgba(110,123,242,0.12), transparent 62%),
      radial-gradient(700px 420px at 88% 4%, rgba(154,139,247,0.05), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  ::selection { background: rgba(110,123,242,0.32); color: #fff; }

  .wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 0 24px 120px; }

  /* ---------- Page-load entrance (CSS-only, never gets stuck hidden) ---------- */
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .topbar, .hero h1, .hero p, #cmd, .cmd-actions { animation: rise 0.6s var(--ease) both; }
  .hero h1 { animation-delay: 0.04s; }
  .hero p  { animation-delay: 0.09s; }
  #cmd     { animation-delay: 0.14s; }
  .cmd-actions { animation-delay: 0.19s; }

  /* ---------- Top bar ---------- */
  .topbar { display: flex; align-items: center; gap: 12px; padding: 24px 0 0; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: var(--r-md);
    background: linear-gradient(150deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    box-shadow: var(--shadow-sm), var(--inset-hi);
  }
  .brand-mark svg { color: #fff; }
  .brand-name { font-weight: 600; font-size: 15px; letter-spacing: -0.02em; }
  .topbar .spacer { flex: 1; }
  .kbd-hint { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  kbd {
    font-family: var(--mono); font-size: 11px;
    background: var(--surface-2); border: 1px solid var(--border); border-bottom-width: 2px;
    padding: 2px 6px; border-radius: var(--r-xs); color: var(--text-2); line-height: 1;
  }

  /* ---------- Hero ---------- */
  .hero { padding: 56px 0 24px; text-align: center; transition: padding var(--t-slow) var(--ease); }
  .hero h1 {
    font-size: clamp(32px, 5.2vw, 44px);
    font-weight: 600; letter-spacing: -0.035em; line-height: 1.04;
    background: linear-gradient(180deg, #fff 30%, #bcbfcc);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    transition: font-size var(--t-slow) var(--ease);
  }
  .hero p {
    margin-top: 12px; color: var(--text-2); font-size: 16px; font-weight: 400;
    max-width: 440px; margin-left: auto; margin-right: auto;
    transition: opacity var(--t) var(--ease), max-height var(--t-slow) var(--ease), margin var(--t-slow) var(--ease);
    max-height: 60px; overflow: hidden;
  }
  /* once results exist, compact the hero so results sit higher */
  .has-results .hero { padding: 28px 0 12px; }
  .has-results .hero h1 { font-size: clamp(24px, 4vw, 32px); }
  .has-results .hero p { opacity: 0; max-height: 0; margin-top: 0; }

  /* ---------- Command bar ---------- */
  .cmd {
    margin-top: 24px;
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border-2);
    border-radius: var(--r-2xl);
    padding: 8px 8px 8px 16px;
    display: flex; align-items: flex-start; gap: 8px;
    box-shadow: var(--shadow-lg), var(--inset-hi);
    transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease);
  }
  .cmd.focus { border-color: var(--accent-line); box-shadow: var(--shadow-lg), 0 0 0 4px var(--accent-soft); }
  .cmd-glyph {
    margin-top: 8px; color: var(--muted); flex-shrink: 0;
    transition: color var(--t-slow) var(--ease), transform var(--t-slow) var(--ease);
  }
  .cmd.detected .cmd-glyph { color: var(--accent); transform: scale(1.05); }
  .cmd textarea {
    flex: 1; background: none; border: none; outline: none; resize: none;
    color: var(--text); font-family: var(--sans); font-size: 16px;
    line-height: 1.7; padding: 8px 0; min-height: 24px; max-height: 200px; letter-spacing: -0.01em;
  }
  .cmd textarea::placeholder { color: var(--muted); }
  .paste-btn {
    flex-shrink: 0; margin-top: 2px;
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--text-2);
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 8px 12px; border-radius: var(--r-md); cursor: pointer;
    transition: color var(--t), background var(--t), border-color var(--t), transform var(--t-fast);
  }
  .paste-btn:hover { color: var(--text); background: var(--surface-3); border-color: var(--border-2); }
  .paste-btn:active { transform: scale(0.96); }

  .cmd-actions { display: flex; align-items: center; gap: 16px; margin-top: 16px; }
  .detect-chip {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted); font-family: var(--mono);
    min-height: 20px; transition: color var(--t);
  }
  .detect-chip.on { color: var(--text-2); }
  .detect-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: background var(--t-slow), box-shadow var(--t-slow); }
  .detect-chip.on .detect-dot { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
  .cmd-actions .spacer { flex: 1; }

  /* ---------- Buttons ---------- */
  .btn {
    font-family: var(--sans); font-weight: 500; font-size: 14px;
    border-radius: var(--r-md); border: 1px solid transparent; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 16px; min-height: 40px; white-space: nowrap;
    transition: background var(--t), border-color var(--t), color var(--t), opacity var(--t), transform var(--t-fast);
  }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }
  .btn-primary {
    color: #fff;
    background: linear-gradient(180deg, var(--accent), #5a67e0);
    box-shadow: 0 4px 14px -6px rgba(110,123,242,0.45), var(--inset-hi);
  }
  .btn-primary:hover { background: linear-gradient(180deg, #7d89f5, #5a67e0); }
  .btn-primary:active { transform: scale(0.985); }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
  .btn-ghost { color: var(--text-2); background: var(--surface-2); border-color: var(--border); }
  .btn-ghost:hover { color: var(--text); background: var(--surface-3); border-color: var(--border-2); }
  .btn-ghost:active { transform: scale(0.985); }

  /* ---------- Results ---------- */
  .results { margin-top: 40px; display: flex; flex-direction: column; gap: 16px; }

  .agg { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); padding: 0 4px; }
  .agg strong { color: var(--text-2); font-weight: 500; }
  .agg .agg-sep { opacity: 0.4; }

  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.012));
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    overflow: hidden;
    box-shadow: var(--shadow-md);
  }
  .card.error-card { border-color: rgba(242,121,123,0.24); }

  /* video preview */
  .preview { display: flex; gap: 16px; padding: 16px; }
  .thumb {
    width: 152px; aspect-ratio: 16/9; border-radius: var(--r-lg); flex-shrink: 0;
    background: var(--surface-2) center/cover no-repeat;
    border: 1px solid var(--border); position: relative; overflow: hidden;
  }
  .thumb::after { content: ''; position: absolute; inset: 0; background: linear-gradient(200deg, transparent 55%, rgba(0,0,0,0.35)); }
  .thumb .play {
    position: absolute; inset: 0; margin: auto; width: 34px; height: 34px;
    display: grid; place-items: center; z-index: 1;
    background: rgba(10,11,15,0.55); border: 1px solid rgba(255,255,255,0.18);
    border-radius: 50%; backdrop-filter: blur(6px); color: #fff;
  }
  .pv-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pv-title {
    font-size: 18px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .pv-channel { color: var(--text-2); font-size: 13px; margin-top: 6px; display: flex; align-items: center; gap: 8px; }
  .pv-channel .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--muted); }
  .pv-stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 12px; }
  .pill {
    font-family: var(--mono); font-size: 12px; color: var(--text-2);
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 4px 8px; border-radius: var(--r-sm); display: inline-flex; gap: 5px; align-items: center;
  }
  .pill b { color: var(--text); font-weight: 500; }

  /* transcript block */
  .tx { border-top: 1px solid var(--border); padding: 16px; }
  .tx-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }

  /* segmented toggle */
  .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 3px; position: relative; }
  .seg button {
    position: relative; z-index: 1; font-family: var(--sans); font-size: 13px; font-weight: 500;
    color: var(--text-2); background: none; border: none; cursor: pointer;
    padding: 6px 14px; border-radius: var(--r-sm); transition: color var(--t);
  }
  .seg button:hover { color: var(--text); }
  .seg button.active { color: var(--text); }
  .seg button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }
  .seg .seg-ind {
    position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 3px;
    background: var(--surface-3); border: 1px solid var(--border-2);
    border-radius: var(--r-sm); transition: transform var(--t-slow) var(--ease), width var(--t-slow) var(--ease);
  }

  /* search within transcript */
  .tx-search { flex: 1; min-width: 160px; position: relative; display: flex; align-items: center; }
  .tx-search svg { position: absolute; left: 11px; color: var(--muted); pointer-events: none; }
  .tx-search input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--r-md); color: var(--text); font-family: var(--sans); font-size: 13px;
    padding: 8px 34px 8px 34px; min-height: 36px; outline: none;
    transition: border-color var(--t), box-shadow var(--t);
  }
  .tx-search input:focus { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
  .tx-search input::placeholder { color: var(--muted); }
  .match-count { font-family: var(--mono); font-size: 11px; color: var(--muted); position: absolute; right: 12px; }

  .tx-panel {
    background: rgba(0,0,0,0.22);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 16px 20px;
    max-height: 420px; overflow-y: auto;
    font-size: 15px; line-height: 1.85; color: #d9dbe2; letter-spacing: -0.003em;
  }
  .tx-panel:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }
  .tx-panel.mono-view { font-size: 13px; line-height: 1.55; }
  .tx-panel::-webkit-scrollbar { width: 10px; }
  .tx-panel::-webkit-scrollbar-track { background: transparent; }
  .tx-panel::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 5px; border: 3px solid transparent; background-clip: padding-box; }
  .tx-panel::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); background-clip: padding-box; }
  .ts-line { display: flex; gap: 12px; padding: 3px 0; }
  .ts-time { font-family: var(--mono); font-size: 11px; color: var(--accent); opacity: 0.85; flex-shrink: 0; padding-top: 2px; min-width: 52px; }
  mark { background: rgba(232,184,102,0.28); color: #fbe9c6; border-radius: 3px; padding: 0 1px; }

  /* action row */
  .tx-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .act {
    font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--text-2);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md);
    padding: 8px 12px; min-height: 34px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    transition: color var(--t), background var(--t), border-color var(--t), transform var(--t-fast); text-decoration: none;
  }
  .act:hover { color: var(--text); background: var(--surface-3); border-color: var(--border-2); }
  .act:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }
  .act:active { transform: scale(0.97); }
  .act svg { flex-shrink: 0; }
  .act.copied { color: var(--green); border-color: var(--green-soft); background: var(--green-soft); }
  .act.summarize { color: var(--accent-2); border-color: var(--accent-line); background: var(--accent-soft); }
  .act.summarize:hover { background: rgba(110,123,242,0.2); color: #cdc7fb; }

  /* summary panel */
  .summary-panel {
    margin-top: 16px; border: 1px solid var(--accent-line); border-radius: var(--r-lg);
    background: linear-gradient(180deg, var(--accent-soft), rgba(110,123,242,0.04));
    padding: 16px 20px; font-size: 14px; line-height: 1.7; color: #dcdcea;
  }
  .summary-panel .sp-head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: var(--accent-2); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
  .summary-panel p { margin: 0; white-space: pre-wrap; }

  /* error card */
  .err-row { display: flex; align-items: center; gap: 12px; padding: 16px; }
  .err-icon { width: 38px; height: 38px; border-radius: var(--r-md); background: var(--red-soft); color: var(--red); display: grid; place-items: center; flex-shrink: 0; }
  .err-body { min-width: 0; }
  .err-url { font-family: var(--mono); font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .err-msg { font-size: 13px; color: var(--red); margin-top: 4px; }

  /* ---------- Skeleton ---------- */
  .skel-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-xl); overflow: hidden; }
  .skel { position: relative; overflow: hidden; background: var(--surface-2); border-radius: var(--r-sm); }
  .skel::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
    transform: translateX(-100%); animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { 100% { transform: translateX(100%); } }
  .skel-preview { display: flex; gap: 16px; padding: 16px; }
  .skel-thumb { width: 152px; aspect-ratio: 16/9; border-radius: var(--r-lg); flex-shrink: 0; }
  .skel-lines { flex: 1; display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
  .skel-body { border-top: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; gap: 12px; }

  /* ---------- Bulk export bar ---------- */
  .export-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); }
  .export-bar .lbl { font-size: 13px; color: var(--text-2); font-weight: 500; margin-right: 4px; }

  /* ---------- Empty ---------- */
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }

  /* ---------- Toast ---------- */
  .toast-wrap { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 999; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast {
    display: flex; align-items: center; gap: 10px;
    background: rgba(20,21,27,0.9); border: 1px solid var(--border-2);
    border-radius: var(--r-lg); padding: 12px 16px; font-size: 13px; color: var(--text);
    box-shadow: var(--shadow-lg); backdrop-filter: blur(14px);
  }
  .toast .ic { display: grid; place-items: center; color: var(--green); }
  .toast .ic.err { color: var(--red); }

  /* ---------- Responsive ---------- */
  @media (max-width: 640px) {
    .wrap { padding: 0 16px 96px; }
    .hero { padding: 40px 0 20px; }
    .has-results .hero { padding: 24px 0 8px; }
    .preview { flex-direction: column; }
    .thumb { width: 100%; }
    .cmd-actions { flex-wrap: wrap; }
    .cmd-actions .detect-chip { order: 1; width: 100%; }
    .cmd-actions .spacer { display: none; }
    .cmd-actions .btn-ghost { order: 2; flex: 0 0 auto; }
    .cmd-actions .btn-primary { order: 3; flex: 1; }
    .kbd-hint { display: none; }
    .tx-bar { flex-direction: column; align-items: stretch; }
    .seg { justify-content: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4" width="14" height="16" rx="2.5"/><path d="M6 9h6M6 13h4"/><path d="M22 8l-6 4 6 4z"/>
        </svg>
      </div>
      <span class="brand-name">TranscriptVault</span>
    </div>
    <div class="spacer"></div>
    <div class="kbd-hint"><kbd>⌘</kbd><kbd>↵</kbd> to extract</div>
  </header>

  <!-- Hero -->
  <div class="hero">
    <h1>YouTube transcripts, instantly.</h1>
    <p>Paste a link. Get clean, searchable text — ready to read, copy, or export.</p>
  </div>

  <!-- Command bar -->
  <div class="cmd" id="cmd">
    <span class="cmd-glyph" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    <textarea id="urlInput" rows="1" placeholder="Paste a YouTube URL…" spellcheck="false" autocomplete="off" aria-label="YouTube URL or video ID"></textarea>
    <button class="paste-btn" id="pasteBtn" title="Paste from clipboard" aria-label="Paste from clipboard">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
      Paste
    </button>
  </div>

  <div class="cmd-actions">
    <span class="detect-chip" id="detectChip"><span class="detect-dot"></span><span id="detectText">Waiting for a link</span></span>
    <span class="spacer"></span>
    <button class="btn btn-ghost" id="clearBtn" style="display:none;">Clear</button>
    <button class="btn btn-primary" id="extractBtn" disabled>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      Extract transcript
    </button>
  </div>

  <!-- Results -->
  <div class="results" id="results" aria-live="polite"></div>
</div>

<div class="toast-wrap" id="toastWrap" role="status" aria-live="polite"></div>

<script type="module">
/* ---------- Motion (motion.dev vanilla) with a WAAPI fallback ---------- */
let animate;
try {
  const m = await import('https://cdn.jsdelivr.net/npm/motion@11.11.13/+esm');
  animate = m.animate;
} catch (e) {
  animate = (el, keyframes, opts = {}) => {
    const els = el instanceof NodeList || Array.isArray(el) ? [...el] : [el];
    const dur = (opts.duration ?? 0.3) * 1000;
    els.forEach((node, i) => {
      const delay = typeof opts.delay === 'function' ? opts.delay(i) * 1000 : (opts.delay ?? 0) * 1000;
      const kf = {}; for (const k in keyframes) kf[k] = Array.isArray(keyframes[k]) ? keyframes[k] : [keyframes[k]];
      try { node.animate(kf, { duration: dur, delay, easing: 'cubic-bezier(0.22,1,0.36,1)', fill: 'both' }); } catch (_) {}
    });
    return { finished: Promise.resolve() };
  };
}
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const anim = (el, kf, opts) => { if (reduce || !el) return; animate(el, kf, opts); };

/* ---------- State ---------- */
let results = [];

/* ---------- Elements ---------- */
const wrap = document.getElementById('wrap');
const cmd = document.getElementById('cmd');
const input = document.getElementById('urlInput');
const detectChip = document.getElementById('detectChip');
const detectText = document.getElementById('detectText');
const extractBtn = document.getElementById('extractBtn');
const clearBtn = document.getElementById('clearBtn');
const pasteBtn = document.getElementById('pasteBtn');
const resultsEl = document.getElementById('results');

/* ---------- Helpers ---------- */
const esc = (s) => (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const escReg = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function detectUrls(raw) {
  const ids = new Set();
  const lines = raw.split(/[\n,\s]+/).map(s => s.trim()).filter(Boolean);
  for (const line of lines) {
    let m = line.match(/(?:v=|\/v\/|youtu\.be\/|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/);
    if (m) { ids.add(m[1]); continue; }
    if (/^[A-Za-z0-9_-]{11}$/.test(line)) ids.add(line);
  }
  return [...ids];
}

function updateDetection() {
  const raw = input.value;
  const ids = detectUrls(raw);
  const has = ids.length > 0;
  cmd.classList.toggle('detected', has);
  detectChip.classList.toggle('on', has);
  extractBtn.disabled = !has;
  clearBtn.style.display = raw.trim() ? 'inline-flex' : 'none';
  detectText.textContent = has
    ? `${ids.length} link${ids.length > 1 ? 's' : ''} ready`
    : (raw.trim() ? 'No valid YouTube link found' : 'Waiting for a link');
  autoGrow();
}

function autoGrow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px'; }

/* ---------- Toast ---------- */
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = 'toast';
  const icon = type === 'err'
    ? '<span class="ic err"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg></span>'
    : '<span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg></span>';
  el.innerHTML = icon + '<span>' + esc(msg) + '</span>';
  document.getElementById('toastWrap').appendChild(el);
  anim(el, { opacity: [0, 1], transform: ['translateY(12px) scale(0.96)', 'translateY(0) scale(1)'] }, { duration: 0.35 });
  setTimeout(() => {
    anim(el, { opacity: [1, 0], transform: ['translateY(0)', 'translateY(8px)'] }, { duration: 0.25 });
    setTimeout(() => el.remove(), 260);
  }, 2600);
}

/* ---------- Skeleton ---------- */
function showSkeleton(count) {
  wrap.classList.add('has-results');
  resultsEl.innerHTML = '';
  for (let i = 0; i < Math.min(count, 4); i++) {
    const s = document.createElement('div');
    s.className = 'skel-card';
    s.innerHTML = `
      <div class="skel-preview">
        <div class="skel skel-thumb"></div>
        <div class="skel-lines">
          <div class="skel" style="height:18px;width:72%"></div>
          <div class="skel" style="height:13px;width:44%"></div>
          <div style="flex:1"></div>
          <div class="skel" style="height:22px;width:60%;border-radius:8px"></div>
        </div>
      </div>
      <div class="skel-body">
        <div class="skel" style="height:12px;width:100%"></div>
        <div class="skel" style="height:12px;width:96%"></div>
        <div class="skel" style="height:12px;width:88%"></div>
        <div class="skel" style="height:12px;width:92%"></div>
      </div>`;
    resultsEl.appendChild(s);
    anim(s, { opacity: [0, 1], transform: ['translateY(10px)', 'translateY(0)'] }, { duration: 0.4, delay: i * 0.06 });
  }
}

/* ---------- Fetch ---------- */
async function extract() {
  const ids = detectUrls(input.value);
  if (!ids.length) return;

  anim(extractBtn, { transform: ['scale(1)', 'scale(0.95)', 'scale(1)'] }, { duration: 0.32 });
  extractBtn.disabled = true;
  const original = extractBtn.innerHTML;
  extractBtn.innerHTML = '<svg class="spin" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.5"/></svg> Extracting…';
  extractBtn.querySelector('.spin').animate([{transform:'rotate(0)'},{transform:'rotate(360deg)'}], {duration:800, iterations:Infinity});

  showSkeleton(ids.length);

  try {
    const res = await fetch('/api/fetch', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ urls: ids })
    });
    const data = await res.json();
    results = data.results || [];
    render();
    const ok = results.filter(r => r.status === 'success').length;
    if (ok) toast(`${ok} transcript${ok > 1 ? 's' : ''} ready`);
    else toast('No transcripts could be extracted', 'err');
  } catch (err) {
    resultsEl.innerHTML = '<div class="empty">Couldn’t reach the server. Make sure the app is running, then try again.</div>';
    toast('Server unreachable', 'err');
  }
  extractBtn.innerHTML = original;
  extractBtn.disabled = false;
}

/* ---------- Render ---------- */
function fmtNum(n) { return (n ?? 0).toLocaleString(); }

function render() {
  wrap.classList.add('has-results');
  resultsEl.innerHTML = '';
  if (!results.length) return;

  const okResults = results.filter(r => r.status === 'success');

  if (results.length > 1) {
    const words = okResults.reduce((s, r) => s + (r.word_count || 0), 0);
    const agg = document.createElement('div');
    agg.className = 'agg';
    agg.innerHTML = `<strong>${okResults.length}</strong> extracted<span class="agg-sep">·</span>` +
      (results.length - okResults.length ? `<strong>${results.length - okResults.length}</strong> failed<span class="agg-sep">·</span>` : '') +
      `<strong>${fmtNum(words)}</strong> words total`;
    resultsEl.appendChild(agg);
  }

  results.forEach((r, i) => {
    const card = r.status === 'success' ? successCard(r, i) : errorCard(r);
    resultsEl.appendChild(card);
    anim(card, { opacity: [0, 1], transform: ['translateY(16px)', 'translateY(0)'] }, { duration: 0.5, delay: i * 0.07 });
  });

  if (okResults.length > 1) resultsEl.appendChild(exportBar());
}

function errorCard(r) {
  const el = document.createElement('div');
  el.className = 'card error-card';
  el.innerHTML = `
    <div class="err-row">
      <div class="err-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg></div>
      <div class="err-body">
        <div class="err-url">${esc(r.url || r.video_id || 'Unknown')}</div>
        <div class="err-msg">${esc(r.error || 'Extraction failed')}</div>
      </div>
    </div>`;
  return el;
}

function successCard(r, i) {
  const el = document.createElement('div');
  el.className = 'card';
  const thumb = r.thumbnail || `https://i.ytimg.com/vi/${r.video_id}/hqdefault.jpg`;
  const chars = r.char_count ?? (r.full_text || '').length;
  el.innerHTML = `
    <div class="preview">
      <div class="thumb" style="background-image:url('${esc(thumb)}')">
        <span class="play" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
      </div>
      <div class="pv-meta">
        <div class="pv-title">${esc(r.title || r.video_id)}</div>
        <div class="pv-channel">${r.channel ? esc(r.channel) + '<span class="dot"></span>' : ''}<span>${esc(r.language || 'en')}</span></div>
        <div class="pv-stats">
          <span class="pill"><b>${fmtNum(r.word_count)}</b> words</span>
          <span class="pill"><b>${fmtNum(chars)}</b> chars</span>
          <span class="pill"><b>${esc(r.duration || '—')}</b></span>
          <span class="pill"><b>${fmtNum(r.entry_count)}</b> segments</span>
        </div>
      </div>
    </div>
    <div class="tx">
      <div class="tx-bar">
        <div class="seg" data-seg role="group" aria-label="Transcript view">
          <span class="seg-ind"></span>
          <button class="active" data-view="full" aria-pressed="true">Full text</button>
          <button data-view="ts" aria-pressed="false">Timestamped</button>
        </div>
        <div class="tx-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" placeholder="Search this transcript…" data-search aria-label="Search this transcript">
          <span class="match-count" data-matchcount aria-live="polite"></span>
        </div>
      </div>
      <div class="tx-panel" data-panel tabindex="0" role="region" aria-label="Transcript"></div>
      <div class="tx-actions">
        <button class="act" data-copy>
          <svg class="ic-copy" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span class="copy-label">Copy</span>
        </button>
        <button class="act" data-dl="single_txt"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg> TXT</button>
        <button class="act" data-dl="single_markdown"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg> Markdown</button>
        <button class="act summarize" data-summarize><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.2L19 10l-5.1 1.8L12 17l-1.9-5.2L5 10l5.1-1.8z"/></svg> AI Summary</button>
        <a class="act" href="https://www.youtube.com/watch?v=${r.video_id}" target="_blank" rel="noopener">Open ↗</a>
      </div>
      <div data-summaryslot></div>
    </div>`;

  wireCard(el, r);
  return el;
}

/* ---------- Per-card behaviour ---------- */
function wireCard(el, r) {
  const panel = el.querySelector('[data-panel]');
  const searchInput = el.querySelector('[data-search]');
  const matchCount = el.querySelector('[data-matchcount]');
  const seg = el.querySelector('[data-seg]');
  const segInd = el.querySelector('.seg-ind');
  const segBtns = [...seg.querySelectorAll('button')];
  let view = 'full';

  function renderPanel() {
    const q = searchInput.value.trim();
    let matches = 0;
    const hl = (text) => {
      if (!q) return esc(text);
      return esc(text).replace(new RegExp(escReg(esc(q)), 'gi'), (m) => { matches++; return `<mark>${m}</mark>`; });
    };
    if (view === 'full') {
      panel.classList.remove('mono-view');
      panel.innerHTML = hl(r.full_text || '');
    } else {
      panel.classList.add('mono-view');
      panel.innerHTML = (r.timestamped || []).map(e =>
        `<div class="ts-line"><span class="ts-time">${esc(e.timestamp)}</span><span>${hl(e.text)}</span></div>`
      ).join('');
    }
    matchCount.textContent = q ? `${matches}` : '';
  }

  function moveIndicator(btn) {
    segInd.style.width = btn.offsetWidth + 'px';
    segInd.style.transform = `translateX(${btn.offsetLeft - 3}px)`;
  }

  segBtns.forEach(btn => btn.addEventListener('click', () => {
    segBtns.forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
    btn.classList.add('active'); btn.setAttribute('aria-pressed', 'true');
    view = btn.dataset.view;
    moveIndicator(btn);
    renderPanel();
    anim(panel, { opacity: [0.5, 1] }, { duration: 0.25 });
  }));

  let deb;
  searchInput.addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(renderPanel, 90); });
  searchInput.addEventListener('keydown', (e) => { if (e.key === 'Escape') { searchInput.value = ''; renderPanel(); } });

  const copyBtn = el.querySelector('[data-copy]');
  copyBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(r.full_text || ''); } catch (_) {}
    const label = copyBtn.querySelector('.copy-label');
    const icon = copyBtn.querySelector('.ic-copy');
    copyBtn.classList.add('copied');
    label.textContent = 'Copied';
    icon.innerHTML = '<path d="M20 6L9 17l-5-5"/>';
    anim(icon, { transform: ['scale(0.4)', 'scale(1)'] }, { duration: 0.35 });
    setTimeout(() => {
      copyBtn.classList.remove('copied');
      label.textContent = 'Copy';
      icon.innerHTML = '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>';
    }, 1600);
  });

  el.querySelectorAll('[data-dl]').forEach(btn => btn.addEventListener('click', () => downloadOne(r, btn.dataset.dl)));

  const sumBtn = el.querySelector('[data-summarize]');
  const slot = el.querySelector('[data-summaryslot]');
  sumBtn.addEventListener('click', () => summarize(r, sumBtn, slot));

  requestAnimationFrame(() => moveIndicator(segBtns[0]));
  renderPanel();
}

/* ---------- Downloads ---------- */
async function downloadOne(r, exportType) {
  const fmt = exportType === 'single_markdown' ? 'markdown' : 'txt';
  try {
    const res = await fetch('/api/export', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ results: [r], format: fmt, export_type: exportType })
    });
    await triggerDownload(res);
    toast('Download started');
  } catch (_) { toast('Download failed', 'err'); }
}

async function bulkExport(exportType, fmt) {
  const ok = results.filter(r => r.status === 'success');
  if (!ok.length) return;
  try {
    const res = await fetch('/api/export', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ results: ok, format: fmt, export_type: exportType })
    });
    await triggerDownload(res);
    toast('Export started');
  } catch (_) { toast('Export failed', 'err'); }
}

async function triggerDownload(res) {
  const blob = await res.blob();
  const cd = res.headers.get('Content-Disposition') || '';
  const m = cd.match(/filename="?([^"]+)"?/);
  const name = m ? m[1] : 'transcripts';
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ---------- Summary ---------- */
async function summarize(r, btn, slot) {
  if (slot.dataset.loaded === '1') { slot.innerHTML = ''; slot.dataset.loaded = ''; return; }
  btn.disabled = true;
  slot.innerHTML = `<div class="summary-panel"><div class="sp-head">AI Summary</div>
    <div class="skel" style="height:12px;width:90%;margin-bottom:8px"></div>
    <div class="skel" style="height:12px;width:80%;margin-bottom:8px"></div>
    <div class="skel" style="height:12px;width:86%"></div></div>`;
  anim(slot.firstElementChild, { opacity: [0, 1], transform: ['translateY(-4px)', 'translateY(0)'] }, { duration: 0.3 });
  try {
    const res = await fetch('/api/summary', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: r.full_text, title: r.title })
    });
    const data = await res.json();
    if (data.summary) {
      slot.innerHTML = `<div class="summary-panel"><div class="sp-head">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.2L19 10l-5.1 1.8L12 17l-1.9-5.2L5 10l5.1-1.8z"/></svg>
        AI Summary</div><p>${esc(data.summary)}</p></div>`;
      slot.dataset.loaded = '1';
      anim(slot.firstElementChild, { opacity: [0, 1] }, { duration: 0.3 });
    } else {
      slot.innerHTML = `<div class="summary-panel" style="border-color:var(--red-soft);background:var(--red-soft)"><p style="color:var(--red)">${esc(data.error || 'Summary unavailable')}</p></div>`;
    }
  } catch (_) {
    slot.innerHTML = `<div class="summary-panel" style="border-color:var(--red-soft);background:var(--red-soft)"><p style="color:var(--red)">Couldn’t generate a summary.</p></div>`;
  }
  btn.disabled = false;
}

/* ---------- Bulk export bar ---------- */
function exportBar() {
  const el = document.createElement('div');
  el.className = 'export-bar';
  el.innerHTML = `<span class="lbl">Export all</span>
    <button class="act" data-x="single_json" data-f="json">One JSON</button>
    <button class="act" data-x="zip" data-f="txt">TXT (zip)</button>
    <button class="act" data-x="zip" data-f="markdown">Markdown (zip)</button>
    <button class="act" data-x="zip" data-f="timestamped">Timestamped (zip)</button>`;
  el.querySelectorAll('[data-x]').forEach(b => b.addEventListener('click', () => bulkExport(b.dataset.x, b.dataset.f)));
  anim(el, { opacity: [0, 1], transform: ['translateY(10px)', 'translateY(0)'] }, { duration: 0.4, delay: 0.1 });
  return el;
}

/* ---------- Events ---------- */
input.addEventListener('input', updateDetection);
input.addEventListener('focus', () => cmd.classList.add('focus'));
input.addEventListener('blur', () => cmd.classList.remove('focus'));
extractBtn.addEventListener('click', extract);
clearBtn.addEventListener('click', () => {
  input.value = ''; results = []; resultsEl.innerHTML = '';
  wrap.classList.remove('has-results');
  updateDetection(); input.focus();
});

pasteBtn.addEventListener('click', async () => {
  try {
    const text = await navigator.clipboard.readText();
    input.value = input.value ? input.value + '\n' + text : text;
    updateDetection();
    anim(cmd, { transform: ['scale(0.995)', 'scale(1)'] }, { duration: 0.25 });
    input.focus();
  } catch (_) { toast('Clipboard access blocked — paste with ⌘V', 'err'); }
});

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && !extractBtn.disabled) { e.preventDefault(); extract(); }
});

window.addEventListener('load', () => { input.focus(); updateDetection(); });
</script>
</body>
</html>
